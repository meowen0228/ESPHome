esphome:
  name: esphome-web-ir
  friendly_name: IR esp32
  min_version: "20250500"
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Allow Over-The-Air updates
ota:
- platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Taipei

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

remote_transmitter:
  pin: GPIO27
  carrier_duty_percent: 50%

remote_receiver:
    - id: ir_receiver_gpio14
      pin:
        number: GPIO14
        inverted: true
      # dump: all

    # - id: ir_receiver_gpio26
    #   pin:
    #     number: GPIO26
    #     inverted: true
    #   dump: all
    #   tolerance: 50%
    #   filter: 250us
    #   idle: 4ms
    #   buffer_size: 2kb

climate:
  - platform: climate_ir_lg
    id: living_room_ac
    name: "Living Room AC"
    receiver_id: ir_receiver_gpio14
    visual:
      min_temperature: 24 °C
      max_temperature: 28 °C
      temperature_step: 1.0 °C
    on_control:
      - lambda: |-
          climate::ClimateMode mode = x.get_mode().value_or(id(living_room_ac).mode);
          float target_temp = x.get_target_temperature().value_or(id(living_room_ac).target_temperature);

          uint32_t base_code = 0;
          uint8_t temp_code_suffix = 0;
          bool temp_found = true;

          if (target_temp == 24.0f) temp_code_suffix = 0x41;
          else if (target_temp == 25.0f) temp_code_suffix = 0x49;
          else if (target_temp == 26.0f) temp_code_suffix = 0x45;
          else if (target_temp == 27.0f) temp_code_suffix = 0x4D;
          else if (target_temp == 28.0f) temp_code_suffix = 0x43;
          else {
            ESP_LOGW("on_control", " %f not in (24-28度)", target_temp);
            temp_found = false;
          }

          if (!temp_found) {
            return;
          }

          uint32_t final_data = 0;

          if (mode == climate::CLIMATE_MODE_OFF) {
            base_code = 0xC1602000;
            final_data = base_code | temp_code_suffix;
            ESP_LOGI("on_control", "IR OFF: 0x%08X", final_data);

          } else if (mode == climate::CLIMATE_MODE_AUTO || mode == climate::CLIMATE_MODE_COOL) {
            base_code = 0xC1600000;
            final_data = base_code | temp_code_suffix;
            ESP_LOGI("on_control", "IR AUTO/COOL: 0x%08X", final_data);
          } else {
            ESP_LOGW("on_control", "not avalibale mode: %s", LOG_STR(mode));
          }

          // *** 注意：這裡沒有調用 id(my_ir_transmitter).lg_raw_data(...) ***
          // 您將只會在日誌中看到計算出的紅外線碼。

script:
  - id: handle_auto_button
    parameters:
      temp: float
    then:
      - climate.control:
          id: living_room_ac
          target_temperature: !lambda 'return temp;'

  - id: handle_on_off_button
    parameters:
      temp: float
    then:
      - if:
          condition:
            lambda: 'return id(living_room_ac).mode == climate::CLIMATE_MODE_OFF;'
          then:
            - climate.control:
                id: living_room_ac
                target_temperature: !lambda 'return temp;'
                mode: "COOL"
          else:
            - climate.control:
                id: living_room_ac
                mode: "OFF"

binary_sensor:
  # --- 24 度 ---
  - platform: remote_receiver
    receiver_id: ir_receiver_gpio14
    name: "auto_24"
    lg:
      data: 0xC1600041
      nbits: 32
    on_press:
      - script.execute:
          id: handle_auto_button
          temp: 24.0 # 傳遞參數

  - platform: remote_receiver
    receiver_id: ir_receiver_gpio14
    name: "on_off_auto_24"
    lg:
      data: 0xC1602041
      nbits: 32
    on_press:
      - script.execute:
          id: handle_on_off_button
          temp: 24.0 # 傳遞參數

  # --- 25 度 ---
